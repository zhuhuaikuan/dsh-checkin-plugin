#
# 在 **GitHub 仓库**中运行：定时从 Gitee 镜像拉取到当前 GitHub 仓库。
# 用法：
#   1) 在 GitHub 新建（可空）仓库，把本文件放到 .github/workflows/mirror-from-gitee.yml
#   2) 若 Gitee 仓库是私有的，在 GitHub 仓库 Settings → Secrets 添加 GITEE_TOKEN（Gitee 私人令牌，读权限即可）
#   3) Actions 里手动运行一次或等待定时触发
name: Mirror from Gitee

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 20:00 UTC（= 次日 04:00 北京时间）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-from-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Gitee -> GitHub
        env:
          GITEE_REPO: gitee.com/zhuhuaikuan/dsh-checkin-plugin.git
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${GITEE_TOKEN:-}" ]; then
            SRC="https://oauth2:${GITEE_TOKEN}@${GITEE_REPO}"
          else
            SRC="https://${GITEE_REPO}"
          fi
          rm -rf repo.git
          git clone --mirror "$SRC" repo.git
          cd repo.git
          git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git"
